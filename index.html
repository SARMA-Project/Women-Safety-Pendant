<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA Safety Pendant</title>
    <meta name="theme-color" content="#090D16">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #090d16; --card: rgba(19,27,46,.88); --border: rgba(255,255,255,.10); }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            min-height: 100vh; background: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(56,189,248,.13) 0, transparent 55%),
                radial-gradient(at 100% 100%, rgba(244,63,94,.12) 0, transparent 55%);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif; color: #f8fafc; padding: 20px;
        }
        .hero {
            text-align: center;
            background: var(--card); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 48px 36px; max-width: 420px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
        }
        .logo-wrap {
            width: 80px; height: 80px; border-radius: 22px;
            background: linear-gradient(135deg,#0284c7,#2563eb);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; color: #fff; margin: 0 auto 20px;
            box-shadow: 0 0 30px rgba(37,99,235,.4);
        }
        h1 { font-size: 2rem; font-weight: 800; margin-bottom: 6px; }
        .tagline { font-size: .85rem; color: #94a3b8; margin-bottom: 36px; }
        .btn-group { display: flex; flex-direction: column; gap: 14px; }
        .big-btn {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            padding: 18px 20px; border-radius: 16px; border: none;
            font-size: 1rem; font-weight: 700; cursor: pointer;
            text-decoration: none; font-family: inherit; transition: transform .2s;
        }
        .big-btn:hover { transform: translateY(-3px); }
        .btn-user {
            background: linear-gradient(135deg,#0284c7,#2563eb); color: #fff;
            box-shadow: 0 0 24px rgba(56,189,248,.35);
        }
        .btn-parent {
            background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: #f8fafc;
        }
        .btn-icon {
            width: 40px; height: 40px; border-radius: 10px;
            background: rgba(255,255,255,.15);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
        }
        .btn-inner { text-align: left; }
        .btn-title { display: block; font-size: 1rem; font-weight: 800; }
        .btn-sub { display: block; font-size: .72rem; opacity: .75; margin-top: 1px; }
        .divider { text-align: center; font-size: .7rem; color: #475569; font-weight: 700; }
        .footer { margin-top: 28px; font-size: .7rem; color: #475569; }
    </style>
</head>
<body>
    <div class="hero">
        <div class="logo-wrap"><i class="fa-solid fa-shield-halved"></i></div>
        <h1>AURA SAFETY</h1>
        <p class="tagline">Women's Safety Pendant – Select your dashboard</p>

        <div class="btn-group">
            <a href="user.html" class="big-btn btn-user">
                <div class="btn-icon"><i class="fa-solid fa-person-dress"></i></div>
                <div class="btn-inner">
                    <span class="btn-title">Woman User Dashboard</span>
                    <span class="btn-sub">Pair pendant · Fake call · Emergency SOS</span>
                </div>
            </a>

            <div class="divider">— OR —</div>

            <a href="parent.html" class="big-btn btn-parent">
                <div class="btn-icon"><i class="fa-solid fa-users"></i></div>
                <div class="btn-inner">
                    <span class="btn-title">Parent Tracking Dashboard</span>
                    <span class="btn-sub">Live GPS map · SOS alerts · Audio recordings</span>
                </div>
            </a>
        </div>

        <div class="footer">SARMA Project · ESP32-S3 Wearable Pendant v2.0</div>
    </div>
</body>
</html>
