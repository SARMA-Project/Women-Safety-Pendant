<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Safety Pendant</title>
    <meta name="theme-color" content="#FFF0F7">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            min-height: 100vh;
            background: linear-gradient(135deg, #FFF0F7 0%, #F3E8FF 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif; color: #2D1B4E; padding: 20px;
        }
        .hero {
            text-align: center;
            background: #fff;
            border: 1.5px solid #F9A8D4;
            border-radius: 28px;
            padding: 44px 36px; max-width: 420px; width: 100%;
            box-shadow: 0 20px 60px rgba(233,30,140,.12);
        }
        .logo-img {
            width: 140px; height: auto; margin: 0 auto 10px;
            display: block;
        }
        .tagline {
            font-size: .82rem; color: #9333EA;
            font-weight: 700; letter-spacing: .5px;
            margin-bottom: 32px;
        }
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .big-btn {
            display: flex; align-items: center; gap: 14px;
            padding: 16px 20px; border-radius: 16px; border: none;
            font-size: .95rem; font-weight: 700; cursor: pointer;
            text-decoration: none; font-family: inherit;
            transition: transform .2s, box-shadow .2s;
        }
        .big-btn:hover { transform: translateY(-3px); }
        .btn-user {
            background: linear-gradient(135deg,#E91E8C,#9333EA); color: #fff;
            box-shadow: 0 8px 24px rgba(233,30,140,.35);
        }
        .btn-parent {
            background: #F9F5FF; border: 1.5px solid #DDD6FE; color: #4C1D95;
            box-shadow: 0 4px 14px rgba(147,51,234,.1);
        }
        .btn-icon {
            width: 44px; height: 44px; border-radius: 12px;
            background: rgba(255,255,255,.25);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; flex-shrink: 0;
        }
        .btn-parent .btn-icon { background: rgba(147,51,234,.12); color: #7C3AED; }
        .btn-inner { text-align: left; }
        .btn-title { display: block; font-size: .97rem; font-weight: 800; }
        .btn-sub   { display: block; font-size: .7rem; opacity: .8; margin-top: 2px; }
        .divider { text-align: center; font-size: .7rem; color: #C4B5FD; font-weight: 700; }
        .footer { margin-top: 24px; font-size: .68rem; color: #C4B5FD; font-weight: 600; }
    </style>
</head>
<body>
    <div class="hero">
        <img src="assets/logo.png" class="logo-img" alt="Aura Safety Logo">
        <p class="tagline">BE SAFE. BE STRONG. BE YOU.</p>

        <div class="btn-group">
            <a href="user.html" class="big-btn btn-user">
                <div class="btn-icon"><i class="fa-solid fa-person-dress"></i></div>
                <div class="btn-inner">
                    <span class="btn-title">Woman User Dashboard</span>
                    <span class="btn-sub">Pair pendant · Fake call · Emergency SOS</span>
                </div>
            </a>
            <div class="divider">— OR —</div>
            <a href="parent.html" class="big-btn btn-parent">
                <div class="btn-icon"><i class="fa-solid fa-users"></i></div>
                <div class="btn-inner">
                    <span class="btn-title">Parent Tracking Dashboard</span>
                    <span class="btn-sub">Live GPS map · SOS alerts · Audio recordings</span>
                </div>
            </a>
        </div>

        <div class="footer">AURA SAFETY · ESP32-S3 Wearable Pendant v2.0</div>
    </div>
</body>
</html>
